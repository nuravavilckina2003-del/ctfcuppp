name: probe
on:
  push:
    branches: [ 'arena/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch target
        run: |
          mkdir -p artifacts
          {
            echo "===== HEADERS ====="
            curl -si -m 25 http://27wg1nxt69l0o1gh.instances.ctfcup.online/ | head -80
            echo
            echo "===== BODY ====="
            curl -s -m 25 http://27wg1nxt69l0o1gh.instances.ctfcup.online/ | head -400
          } > artifacts/probe.txt 2>&1
          cat artifacts/probe.txt
      - name: Commit results
        run: |
          git config user.name ctf-bot
          git config user.email ctf-bot@example.com
          git add -A artifacts
          git commit -m "probe results [skip ci]" || echo nothing
          git push || true
