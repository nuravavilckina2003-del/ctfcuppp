name: run
on:
  push:
    branches: [ 'arena/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        run: |
          python -m pip install -q requests
          mkdir -p artifacts
          python tools/task.py "$@" || echo "TASK FAILED $?"
      - name: Commit
        run: |
          git config user.name ctf-bot
          git config user.email ctf-bot@example.com
          git add -A artifacts tools
          git commit -m "results [skip ci]" || echo nothing
          git push || true
