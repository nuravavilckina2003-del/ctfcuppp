name: run
on:
  push:
    branches: [ 'arena/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        run: |
          python -m pip install -q requests || echo "PIP FAILED"
          mkdir -p artifacts
          python -u tools/exploit.py > artifacts/out.txt 2>&1 || echo "TASK EXIT $?" >> artifacts/out.txt
          tail -c 8000 artifacts/out.txt
      - name: Commit
        run: |
          git config user.name ctf-bot
          git config user.email ctf-bot@example.com
          git add -A artifacts tools x.js MODE
          git commit -m "results [skip ci]" || echo nothing
          for i in 1 2 3; do git push && break; git pull --rebase -q && sleep 2; done || true
